<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#050816"/>
    <stop offset="0.5" stop-color="#0B1120"/>
    <stop offset="1" stop-color="#111827"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#6366F1"/>
    <stop offset="1" stop-color="#A855F7"/>
  </linearGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#818CF8"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="soft">
    <feGaussianBlur stdDeviation="35"/>
  </filter>

</defs>

<!-- Background -->

<rect width="1400" height="520" rx="24" fill="url(#bg)"/>

<!-- Ambient glow -->

<circle cx="170" cy="80" r="150" fill="#6366F1" opacity="0.10" filter="url(#soft)"/>
<circle cx="1200" cy="430" r="190" fill="#A855F7" opacity="0.09" filter="url(#soft)"/>

<!-- Window -->

<rect x="45" y="35" width="1310" height="450" rx="20"
      fill="#080D19"
      stroke="#263047"
      stroke-width="1.5"/>

<!-- Window Header -->

